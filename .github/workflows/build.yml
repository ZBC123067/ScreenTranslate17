name: Build RootHide package

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
      THEOS_PACKAGE_SCHEME: roothide
      # RootHide's SDK installer supports this token and otherwise makes an
      # unauthenticated GitHub API request, which is rate-limited on shared runners.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install RootHide Theos
        run: |
          set -u
          for attempt in 1 2 3; do
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" && test -f "$THEOS/makefiles/common.mk"; then
              exit 0
            fi
            echo "RootHide Theos installation attempt ${attempt}/3 failed; retrying with a clean toolchain directory."
            rm -rf "$THEOS"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Static source audit
        run: python3 scripts/static_audit.py
      - name: Build package
        run: make clean package FINALPACKAGE=1
      - name: Verify package output
        run: |
          set -euo pipefail
          debs=(packages/*.deb)
          test -f "${debs[0]}"
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          (
            cd "$inspect_dir"
            ar -x "$GITHUB_WORKSPACE/$deb"
          )
          data_tar="$(find "$inspect_dir" -maxdepth 1 -type f -name 'data.tar.*' -print -quit)"
          control_tar="$(find "$inspect_dir" -maxdepth 1 -type f -name 'control.tar.*' -print -quit)"
          test -n "$data_tar"
          test -n "$control_tar"
          find_entry() {
            tar -tf "$data_tar" | awk -v suffix="$1" '$0 ~ suffix { print; count++ } END { if (count != 1) exit 1 }'
          }
          tweak_entry="$(find_entry '(^|/)Library/MobileSubstrate/DynamicLibraries/ScreenTranslate17\\.dylib$')"
          prefs_binary_entry="$(find_entry '(^|/)Library/PreferenceBundles/ScreenTranslate17Prefs\\.bundle/ScreenTranslate17Prefs$')"
          prefs_info_entry="$(find_entry '(^|/)Library/PreferenceBundles/ScreenTranslate17Prefs\\.bundle/Info\\.plist$')"
          preference_loader_entry="$(find_entry '(^|/)Library/PreferenceLoader/Preferences/ScreenTranslate17\\.plist$')"
          preference_icon_entry="$(find_entry '(^|/)Library/PreferenceLoader/Preferences/ScreenTranslate17\\.png$')"
          postinst_entry="$(tar -tf "$control_tar" | awk '$0 ~ /(^|\/)postinst$/ { print; count++ } END { if (count != 1) exit 1 }')"
          tar -xOf "$data_tar" "$tweak_entry" > "$inspect_dir/ScreenTranslate17.dylib"
          tar -xOf "$data_tar" "$prefs_binary_entry" > "$inspect_dir/ScreenTranslate17Prefs"
          tar -xOf "$data_tar" "$prefs_info_entry" > "$inspect_dir/Info.plist"
          tar -xOf "$data_tar" "$preference_loader_entry" > "$inspect_dir/ScreenTranslate17.plist"
          tar -xOf "$data_tar" "$preference_icon_entry" > "$inspect_dir/ScreenTranslate17.png"
          tar -xOf "$control_tar" "$postinst_entry" > "$inspect_dir/postinst"
           test -s "$inspect_dir/ScreenTranslate17.dylib"
           test -s "$inspect_dir/ScreenTranslate17Prefs"
           test -s "$inspect_dir/ScreenTranslate17.png"
           plutil -lint "$inspect_dir/Info.plist"
           plutil -lint "$inspect_dir/ScreenTranslate17.plist"
           grep -q 'killall -9 Preferences' "$inspect_dir/postinst"
           test "$(plutil -extract entry.bundle raw -o - "$inspect_dir/ScreenTranslate17.plist")" = "ScreenTranslate17Prefs"
           test "$(plutil -extract entry.detail raw -o - "$inspect_dir/ScreenTranslate17.plist")" = "STRootListController"
           plutil -extract entry.isController xml1 -o "$inspect_dir/is-controller.plist" "$inspect_dir/ScreenTranslate17.plist"
           grep -Eq '<true[[:space:]]*/>' "$inspect_dir/is-controller.plist"
          test "$(lipo -archs "$inspect_dir/ScreenTranslate17.dylib" | tr -s ' ')" = "arm64e"
          test "$(lipo -archs "$inspect_dir/ScreenTranslate17Prefs" | tr -s ' ')" = "arm64e"
      - name: Upload DEB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslate17-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
